name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

  cuda-build:
    # Compile check only: no GPU on hosted runners. Also runs the probes' GPU-free phases.
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.0.0-devel-ubuntu24.04
    strategy:
      matrix:
        arch: [sm_121a, sm_120a, sm_90]  # GB10, consumer Blackwell, a pre-Blackwell control
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends make python3
      - run: make -C backends/cuda ARCH=${{ matrix.arch }}
      - run: python3 -m unittest tests.test_cuda_host_phases -v
